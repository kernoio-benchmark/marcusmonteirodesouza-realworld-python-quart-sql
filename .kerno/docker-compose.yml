services:
  postgres:
    image: "postgres:16-alpine"
    pull_policy: missing
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    environment:
      - "POSTGRES_USER=test_user"
      - "POSTGRES_PASSWORD=test_password"
      - "POSTGRES_DB=test_db"
    ports:
      - "5432"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U test_user -d test_db"
      interval: "3s"
      timeout: "5s"
      retries: "10"
    tmpfs:
      - /var/lib/postgresql/data
    labels:
      - external-url=postgresql://localhost:{{PORT}}/test_db?user=test_user&password=test_password

  sut:
    build:
      context: ${BUILD_CONTEXT}
      dockerfile_inline: |
        FROM python:3.10-slim AS build-env

        ARG POETRY_VERSION=1.3.2

        # Copy files
        COPY . /app
        WORKDIR /app

        # Install production dependencies
        RUN pip install --upgrade pip && \
            pip install poetry==$$POETRY_VERSION && \
            poetry config virtualenvs.in-project true && \
            poetry install --without dev --no-interaction --no-ansi

        # Runtime
        FROM python:3.10-slim

        ARG PORT=8000
        ENV PORT=$$PORT

        COPY --from=build-env /app /app
        WORKDIR /app

        CMD ["/bin/sh", "-c", "/app/.venv/bin/hypercorn conduit:app --bind 0.0.0.0:$$PORT --debug --access-logfile - --error-logfile -"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000"
    labels:
      - jwt-signing-config=HS256:this_is_a_secret_meeting_all_requirements_of_any_hs_algorithms
